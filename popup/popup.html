<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Scorly</title>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <img src="../icons/icon32.png" alt="" width="20" height="20" />
      <span>Scorly</span>
      <span id="scoreChip" class="score-chip">--</span>
    </div>
    <div class="topbar-actions">
      <button id="themeBtn" class="icon-btn" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button id="refreshBtn" class="icon-btn" title="Re-analyze">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
    </div>
  </header>

  <div id="loadingState" class="state-pane">
    <div class="spinner"></div>
    <p>Analyzing page…</p>
  </div>

  <div id="errorState" class="state-pane hidden">
    <p class="error-text" id="errorText"></p>
  </div>

  <div id="mainContent" class="hidden">

    <div class="url-row">
      <span id="pageUrl" class="page-url"></span>
      <span id="localhostBadge" class="badge hidden">localhost</span>
    </div>

    <div class="compare-bar">
      <button id="saveSnapBtn" class="cmp-btn" title="Store this page locally so you can diff it against another page later">
        Save snapshot
      </button>
      <button id="compareBtn" class="cmp-btn cmp-btn-primary" title="Open the full comparison view in a new tab">
        Compare &#8599;
      </button>
      <span id="snapCount" class="cmp-count"></span>
    </div>

    <nav class="tabs" id="tabStrip">
      <button class="tab-btn active" data-tab="overview">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Overview</button>
      <button class="tab-btn" data-tab="meta">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
        Meta</button>
      <button class="tab-btn" data-tab="content">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>
        Content</button>
      <button class="tab-btn" data-tab="headings">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        H Tags</button>
      <button class="tab-btn" data-tab="links">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        Links</button>
      <button class="tab-btn" data-tab="internal">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 10 20 15 15 20"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/></svg>
        Internal</button>
      <button class="tab-btn" data-tab="external">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        External</button>
      <button class="tab-btn" data-tab="images">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Images</button>
      <button class="tab-btn" data-tab="schema">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        Schema</button>
      <button class="tab-btn" data-tab="tech">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Tech</button>
      <button class="tab-btn" data-tab="perf">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Perf</button>
      <button class="tab-btn" data-tab="security">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Security</button>
      <button class="tab-btn" data-tab="og">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Open Graph</button>
    </nav>

    <div class="tab-scroll">

    <section id="tab-overview" class="tab-pane active">
      <div class="score-row">
        <div class="score-circle-wrap">
          <svg viewBox="0 0 120 120" class="score-circle">
            <circle cx="60" cy="60" r="52" class="score-bg" />
            <circle cx="60" cy="60" r="52" class="score-fg" id="scoreArc" />
          </svg>
          <div class="score-number" id="scoreNumber">--</div>
          <div class="score-caption">SEO SCORE</div>
        </div>
        <div class="score-bars" id="scoreBars"></div>
      </div>

      <div class="count-row" id="countRow">
        <button class="count-tile fail" data-target="group-fail" title="Jump to issues"><div class="count-num" id="issuesCount">0</div><div class="count-txt">Issues</div></button>
        <button class="count-tile warn" data-target="group-warn" title="Jump to warnings"><div class="count-num" id="warningsCount">0</div><div class="count-txt">Warnings</div></button>
        <button class="count-tile pass" data-target="group-pass" title="Jump to passed checks"><div class="count-num" id="passedCount">0</div><div class="count-txt">Passed</div></button>
      </div>

      <div class="panel">
        <div class="panel-title">SERP Preview</div>
        <div class="serp-preview" id="serpPreview"></div>
      </div>

      <div class="panel">
        <div class="panel-title">Quick Stats</div>
        <div class="stat-grid" id="statGrid"></div>
      </div>

      <div class="panel">
        <div class="panel-title">All Checks</div>
        <p class="checks-intro">Every automated check run against this page — tap Issues / Warnings / Passed above to jump here. Each row shows which tab it came from and why it got that result.</p>
        <div id="allChecksPanel"></div>
      </div>
    </section>

    <section id="tab-meta" class="tab-pane"><div id="metaContent"></div></section>
    <section id="tab-content" class="tab-pane"><div id="contentContent"></div></section>
    <section id="tab-headings" class="tab-pane"><div id="headingsContent"></div></section>
    <section id="tab-links" class="tab-pane"><div id="linksContent"></div></section>
    <section id="tab-internal" class="tab-pane"><div id="internalContent"></div></section>
    <section id="tab-external" class="tab-pane"><div id="externalContent"></div></section>
    <section id="tab-images" class="tab-pane"><div id="imagesContent"></div></section>
    <section id="tab-schema" class="tab-pane"><div id="schemaContent"></div></section>
    <section id="tab-tech" class="tab-pane"><div id="techContent"></div></section>
    <section id="tab-perf" class="tab-pane"><div id="perfContent"></div></section>
    <section id="tab-security" class="tab-pane"><div id="securityContent"></div></section>

    <section id="tab-og" class="tab-pane">
      <div id="ogSourceNote" class="og-note"></div>
      <div class="platform-switch" id="platformSwitch">
        <button class="plat-btn active" data-plat="facebook">Facebook</button>
        <button class="plat-btn" data-plat="x">X</button>
        <button class="plat-btn" data-plat="linkedin">LinkedIn</button>
        <button class="plat-btn" data-plat="whatsapp">WhatsApp</button>
        <button class="plat-btn" data-plat="discord">Discord/Slack</button>
      </div>
      <div id="ogPreviewArea"></div>
    </section>

    </div>

    <footer class="export-bar">
      <button class="export-btn" id="exportPdf">PDF</button>
      <button class="export-btn" id="exportCsv">CSV</button>
      <button class="export-btn" id="exportJson">JSON</button>
    </footer>

  </div>
</div>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="inpage-analyzer.js"></script>
<script src="analyze.js"></script>
<script src="snapshots.js"></script>
<script src="scoring.js"></script>
<script src="render.js"></script>
<script src="export.js"></script>
<script src="popup.js"></script>
</body>
</html>
